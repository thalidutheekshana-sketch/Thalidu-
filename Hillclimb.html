<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>HILL CLIMB</title>
<style>body{background:#0a0a0f;color:#fff;text-align:center;font-family:monospace;margin:0}canvas{background:linear-gradient(#1a1a3a,#0a0a0f);display:block;margin:0 auto;border-bottom:2px solid #00ff88}.btn{width:80px;height:80px;border-radius:50%;border:2px solid #00ff88;background:#1a1a2e;color:#00ff88;font-weight:bold}</style></head>
<body><h3 style="color:#00ff88">🏎️ HILL CLIMB RACING</h3><canvas id="c" width="360" height="300"></canvas><div>FUEL: <span id="fuel">100</span>% | <span id="dist">0</span>m</div><div style="display:flex;justify-content:space-around;margin-top:20px"><button class="btn" ontouchstart="gas=-1" ontouchend="gas=0" onmousedown="gas=-1" onmouseup="gas=0">BRAKE</button><button class="btn" ontouchstart="gas=1" ontouchend="gas=0" onmousedown="gas=1" onmouseup="gas=0">GAS</button></div><br><a href="index.html" style="color:#aaa">← BACK</a>
<script>let c=document.getElementById('c'),x=c.getContext('2d'),gas=0,fuel=100,dist=0,carX=60,carY=0,speed=0,hills=[];for(let i=0;i<200;i++)hills.push(Math.sin(i*0.1)*40+Math.cos(i*0.05)*20);function getH(x){let i=Math.floor(x/30);return 200+hills[i%hills.length];}let off=0;function loop(){x.clearRect(0,0,360,300);off+=speed;dist=Math.floor(off/10);document.getElementById('dist').innerText=dist;speed+=gas*0.15;speed*=0.98;if(speed<0)speed=0;if(speed>8)speed=8;let hy=getH(off+carX);carY+=(hy-carY)*0.2;if(gas!=0){fuel-=0.05;if(fuel<=0){fuel=0;speed=0;}}document.getElementById('fuel').innerText=Math.floor(fuel);x.strokeStyle='#00ff88';x.lineWidth=3;x.beginPath();for(let i=0;i<360;i++){let h=getH(off+i);if(i==0)x.moveTo(i,h);else x.lineTo(i,h);}x.lineTo(360,300);x.lineTo(0,300);x.closePath();x.fillStyle='#1a3a2a';x.fill();x.stroke();x.save();x.translate(carX,carY-12);x.rotate(speed*0.1);x.fillStyle='#ff4444';x.fillRect(-15,-6,30,12);x.fillStyle='#fff';x.beginPath();x.arc(-10,6,5,0,7);x.arc(10,6,5,0,7);x.fill();x.restore();requestAnimationFrame(loop);}loop();</script></body></html>
